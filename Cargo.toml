[package]
name = "sparsley"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["LilDojd <yawner@protonmail.com>"]
description = "Sparse set with packed, contiguous values and lazily zeroed sparse storage"
license = "MIT OR Apache-2.0"
keywords = ["sparse-set", "ecs", "map", "collection", "no-std"]
categories = ["data-structures", "game-development", "no-std"]

[workspace]
members = ["bench"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
must_use_candidate = "allow"

[lints]
workspace = true

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }

[profile.bench]
debug = "line-tables-only"
