[package]
name = "sparsley"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["LilDojd <yawner@protonmail.com>"]
description = "Sparse set with packed, contiguous values and lazily zeroed sparse storage"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LilDojd/sparsley"
readme = "README.md"
include = ["/src", "/README.md", "/CHANGELOG.md", "/LICENSE-*"]
keywords = ["sparse-set", "ecs", "map", "collection", "no-std"]
categories = ["data-structures", "game-development", "no-std"]

[workspace]
members = ["bench", "diagram"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
must_use_candidate = "allow"

[features]
# Serialize maps as maps and sets as sequences.
serde = ["dep:serde"]

[dependencies]
sparsley-diagram = { path = "diagram", version = "0.1.0" }
serde = { version = "1.0.219", default-features = false, optional = true }

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
serde_json = "1.0.140"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.bench]
debug = "line-tables-only"
