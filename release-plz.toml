# release-plz configuration: https://release-plz.ieni.dev/docs/config

[workspace]
# Packages are opt-in: only those listed below with `release = true` are
# versioned, tagged and published.
release = false
# Publish only when the release PR is merged, not on every push to main.
release_always = false
pr_labels = ["release"]
dependencies_update = false

[[package]]
name = "sparsley"
release = true
changelog_path = "CHANGELOG.md"
git_tag_name = "v{{ version }}"

# To publish the diagram proc-macro once `sparsley` depends on it, drop
# `publish = false` from diagram/Cargo.toml and set `release = true` here.
# release-plz then releases it before `sparsley`.
[[package]]
name = "sparsley-diagram"
release = false
changelog_path = "diagram/CHANGELOG.md"

[changelog]
protect_breaking_commits = true
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "added" },
    { message = "^fix", group = "fixed" },
    { message = "^perf", group = "performance" },
    { message = "^refactor", group = "changed" },
    { message = "^docs?", group = "documentation" },
    { message = "^revert", group = "reverted" },
    { message = "^(bench|build|chore|ci|style|test)", skip = true },
    { message = ".*", group = "other" },
]
