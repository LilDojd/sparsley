name: Release-plz

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # Publishes to crates.io and creates the git tag and GitHub release once a
  # release PR is merged.
  release:
    name: Release
    if: github.repository == 'LilDojd/sparsley'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # push the tag and create the GitHub release
      id-token: write # crates.io trusted publishing
      pull-requests: read # find the release PR a commit came from
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    steps:
      - name: Generate GitHub App token
        # Tags pushed with the default GITHUB_TOKEN do not trigger workflows.
        if: vars.RELEASE_PLZ_APP_ID != ''
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - &toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          RUSTUP_TOOLCHAIN: stable

  # Opens or updates the release PR with version bumps and changelog.
  release-pr:
    name: Release PR
    if: github.repository == 'LilDojd/sparsley'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release branch
      pull-requests: write # open and update the release PR
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - name: Generate GitHub App token
        # PRs opened with the default GITHUB_TOKEN do not trigger CI.
        if: vars.RELEASE_PLZ_APP_ID != ''
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - *checkout
      - *toolchain
      - uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          RUSTUP_TOOLCHAIN: stable
